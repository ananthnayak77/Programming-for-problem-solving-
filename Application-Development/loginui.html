<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Futuristic Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #0f0f0f, #000000);
      color: #00ffe7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: rgba(20, 20, 20, 0.9);
      border: 2px solid #00ffe7;
      border-radius: 12px;
      padding: 40px;
      width: 350px;
      box-shadow: 0 0 25px #00ffe7;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #00ffe7;
      text-shadow: 0 0 10px #00ffe7;
    }

    .login-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #00ffe7;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 0 10px #00ffe7;
    }

    .login-container input::placeholder {
      color: #00ffe7;
      opacity: 0.7;
    }

    .login-container button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #00ffe7, #0077ff);
      color: #000;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px #00ffe7;
    }

    .login-container button:hover {
      background: linear-gradient(90deg, #0077ff, #00ffe7);
      box-shadow: 0 0 25px #00ffe7;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 12px;
      color: #00ffe7;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>🔐 Futuristic Login</h2>
    <form>
      <input type="text" placeholder="Enter Username" required>
      <input type="password" placeholder="Enter Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="footer-text">Powered by Console Backend</div>
  </div>
</body>
</html>
